<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Eva Face — 3D Cybernetic Holographic Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00f0ff;
    --pink: #ff007f;
    --violet: #7928ca;
    --green: #00ff66;
    --gold: #ffb700;
    --dark: #04060d;
    --hud-bg: rgba(6, 14, 28, 0.80);
    --hud-border: rgba(0, 240, 255, 0.30);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--dark);
    color: #e2e8f0;
    font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* ─── Cyberpunk HUD Overlay ────────────────────────────────── */
  .hud-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px 28px;
  }

  .interactive { pointer-events: auto; }

  /* Top Bar */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
  }

  .brand-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .brand-title {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--cyan);
    text-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(0, 240, 255, 0.15);
    border: 1px solid var(--cyan);
    letter-spacing: 1.5px;
    font-weight: 700;
    color: #fff;
  }

  .brand-subtitle {
    font-size: 13px;
    color: #94a3b8;
    letter-spacing: 1px;
  }

  /* Mode Switcher Buttons */
  .mode-switch-bar {
    display: flex;
    gap: 6px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    padding: 5px;
    border-radius: 10px;
    backdrop-filter: blur(12px);
  }

  .btn-hud {
    background: transparent;
    color: #cbd5e1;
    border: 1px solid transparent;
    padding: 7px 13px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-hud svg {
    display: block;
  }

  .btn-hud:hover {
    background: rgba(0, 240, 255, 0.1);
    color: var(--cyan);
    border-color: rgba(0, 240, 255, 0.3);
  }

  .btn-hud.active {
    background: rgba(0, 240, 255, 0.2);
    color: #fff;
    border-color: var(--cyan);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.4);
  }

  .btn-hud.pink {
    color: #f472b6;
  }

  .btn-hud.pink:hover {
    background: rgba(255, 0, 127, 0.15);
    border-color: var(--pink);
  }

  .btn-hud.pink.active {
    background: rgba(255, 0, 127, 0.25);
    border-color: var(--pink);
    box-shadow: 0 0 14px rgba(255, 0, 127, 0.4);
    color: #fff;
  }

  .status-cluster {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .hud-badge {
    padding: 6px 14px;
    border-radius: 6px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    backdrop-filter: blur(10px);
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    font-weight: 800;
    color: var(--green);
    box-shadow: 0 0 12px rgba(0, 255, 102, 0.2);
    transition: 0.3s;
  }

  /* Bottom Controls & Dialog Area */
  .bottom-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  .quick-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .chip-btn {
    background: rgba(10, 18, 36, 0.85);
    border: 1px solid rgba(0, 240, 255, 0.25);
    color: #cbd5e1;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .chip-btn:hover {
    color: var(--cyan);
    border-color: var(--cyan);
    background: rgba(0, 240, 255, 0.15);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(0, 240, 255, 0.25);
  }

  /* Chat Bar */
  .chat-box {
    width: 100%;
    display: flex;
    gap: 10px;
    background: var(--hud-bg);
    border: 1px solid var(--hud-border);
    padding: 8px 12px;
    border-radius: 12px;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  }

  .chat-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .chat-input::placeholder {
    color: #64748b;
  }

  .action-btn {
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: 0.2s;
  }

  .action-btn:hover {
    filter: brightness(1.2);
    box-shadow: 0 0 16px rgba(0, 240, 255, 0.5);
  }

  .mic-btn {
    background: rgba(255, 0, 127, 0.2);
    border: 1px solid var(--pink);
    color: #fff;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
  }

  .mic-btn:hover {
    background: rgba(255, 0, 127, 0.4);
    box-shadow: 0 0 14px rgba(255, 0, 127, 0.5);
  }

  .mic-btn.active {
    background: var(--pink);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255, 0, 127, 0.7); }
    70% { box-shadow: 0 0 0 16px rgba(255, 0, 127, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 0, 127, 0); }
  }

  /* Subtitle text display */
  .eva-speech-balloon {
    background: rgba(4, 10, 24, 0.90);
    border: 1px solid var(--cyan);
    border-radius: 10px;
    padding: 14px 22px;
    color: #f1f5f9;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
    max-width: 800px;
    text-align: center;
    box-shadow: 0 0 24px rgba(0, 240, 255, 0.25);
    display: none;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="hud-layer">
  <!-- Top Navigation & Status -->
  <div class="top-bar">
    <div class="brand-block">
      <div class="brand-title">
        <span>EVA CYBER FACE</span>
        <span class="brand-badge">v2.0 3D</span>
      </div>
      <div class="brand-subtitle">
        Говорящий виртуальный человек · Точки · Линии · Полигоны
      </div>
    </div>

    <!-- Mode Buttons -->
    <div class="mode-switch-bar interactive">
      <button class="btn-hud active" id="btn-hybrid" title="Все слои вместе">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        <span>Все слои</span>
      </button>
      <button class="btn-hud" id="btn-points" title="Квантовые светящиеся точки">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>
        <span>Точки</span>
      </button>
      <button class="btn-hud" id="btn-lines" title="Нейронный плексус связей">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M12 4v16"/></svg>
        <span>Линии</span>
      </button>
      <button class="btn-hud" id="btn-polys" title="Голографические 3D полигоны">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l9 7-3.5 12h-11L3 9z"/></svg>
        <span>Полигоны</span>
      </button>
      <button class="btn-hud" id="btn-matrix" title="Матричный вид">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4zM3 10h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4zM3 17h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4z"/></svg>
        <span>Матрица</span>
      </button>
    </div>

    <!-- Persona & Status -->
    <div class="status-cluster interactive">
      <button class="btn-hud pink active" id="btn-persona-eva">
        <span>Ева (Eva)</span>
      </button>
      <button class="btn-hud" id="btn-persona-adam">
        <span>Адам (Adam)</span>
      </button>
      <button class="btn-hud" id="btn-orbit" title="Авто-вращение">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="11" ry="4" transform="rotate(-30 12 12)"/></svg>
        <span>Вращение</span>
      </button>
      <div class="hud-badge" id="status-badge">READY</div>
    </div>
  </div>

  <!-- Bottom Dialog & Controls -->
  <div class="bottom-bar interactive">
    <div class="eva-speech-balloon" id="speech-balloon"></div>

    <!-- Quick Prompts -->
    <div class="quick-chips">
      <button class="chip-btn" id="prompt-intro">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span>Кто ты?</span>
      </button>
      <button class="chip-btn" id="prompt-arch">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm2 5h12v2H6zm3 5h6v2H9z"/></svg>
        <span>Архитектура кластера</span>
      </button>
      <button class="chip-btn" id="prompt-presence">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span>Google Meet &amp; Telegram</span>
      </button>
      <button class="chip-btn" id="prompt-modes">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v18M3 12h18"/></svg>
        <span>Демонстрация слоев</span>
      </button>
    </div>

    <!-- Input Bar -->
    <div class="chat-box">
      <input type="text" class="chat-input" id="chat-text" placeholder="Напишите фразу для Евы (она ответит голосом и анимацией рта)..." autocomplete="off" />
      <button class="mic-btn" id="btn-mic" title="Включить микрофон">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
      <button class="action-btn" id="btn-send">
        <span>Сказать</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="loader.js"></script>
</body>
</html>
