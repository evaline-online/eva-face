<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Eva — Matrix 3D Neural Face</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%2300ff66'>日</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --matrix-green: #00ff66;
    --matrix-bright: #e8ffee;
    --matrix-dark: #00220a;
    --matrix-bg: #010402;
    --glass-bg: rgba(2, 12, 6, 0.78);
    --glass-border: rgba(0, 255, 102, 0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--matrix-bg);
    color: #e2e8f0;
    font-family: 'Share Tech Mono', monospace, monospace;
    user-select: none;
    -webkit-user-select: none;
  }

  #canvas-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* ─── Minimalist HUD Overlay ───────────────────────────────── */
  .hud-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 32px;
  }

  .interactive { pointer-events: auto; }

  /* ─── Top Bar ──────────────────────────────────────────────── */
  .top-hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }

  .brand-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 6px 16px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 20px rgba(0, 255, 102, 0.15);
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--matrix-green);
    box-shadow: 0 0 10px var(--matrix-green), 0 0 20px var(--matrix-green);
    animation: pulse 2s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.9); }
    50% { opacity: 1.0; transform: scale(1.2); }
  }

  .brand-title {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2.5px;
    color: var(--matrix-green);
    text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
  }

  .system-meta {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: rgba(0, 255, 102, 0.65);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 6px 14px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
  }

  /* ─── Bottom Area: Subtitles + Minimalist Controls ─────────── */
  .bottom-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }

  /* ─── Floating Holographic Subtitles ───────────────────────── */
  .subtitle-container {
    max-width: 760px;
    width: 92%;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
    transform: translateY(8px);
  }

  .subtitle-content {
    background: rgba(1, 14, 6, 0.88);
    border: 1px solid rgba(0, 255, 102, 0.55);
    padding: 10px 20px;
    border-radius: 12px;
    backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 24px rgba(0, 255, 102, 0.25);
    font-size: 15px;
    line-height: 1.45;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(0, 255, 102, 0.8);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .subtitle-prompt {
    color: var(--matrix-green);
    font-weight: bold;
    user-select: none;
  }

  .cursor-blink {
    color: var(--matrix-green);
    animation: blink 0.9s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ─── Bottom Floating Minimalist Bar ───────────────────────── */
  .bottom-hud {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 8px 14px;
    border-radius: 18px;
    backdrop-filter: blur(20px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 255, 102, 0.2);
    max-width: 820px;
    width: 95%;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-matrix {
    background: rgba(0, 255, 102, 0.08);
    border: 1px solid rgba(0, 255, 102, 0.35);
    color: var(--matrix-green);
    padding: 9px 18px;
    border-radius: 10px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
    outline: none;
  }

  .btn-matrix:hover {
    background: rgba(0, 255, 102, 0.22);
    border-color: var(--matrix-green);
    color: #fff;
    box-shadow: 0 0 16px rgba(0, 255, 102, 0.5);
    transform: translateY(-1px);
  }

  .btn-matrix.active {
    background: rgba(255, 0, 80, 0.25);
    border-color: #ff0055;
    color: #ff3377;
    box-shadow: 0 0 20px rgba(255, 0, 80, 0.6);
  }

  .hud-divider {
    width: 1px;
    height: 28px;
    background: rgba(0, 255, 102, 0.25);
    margin: 0 4px;
  }

  /* Google Meet Input & Launch */
  .meet-cluster {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 280px;
  }

  .meet-input {
    flex: 1;
    background: rgba(0, 10, 4, 0.65);
    border: 1px solid rgba(0, 255, 102, 0.3);
    border-radius: 8px;
    padding: 9px 14px;
    color: #ffffff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.5px;
    outline: none;
    transition: 0.2s;
  }

  .meet-input:focus {
    border-color: var(--matrix-green);
    box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
  }

  .meet-input::placeholder {
    color: rgba(0, 255, 102, 0.45);
  }

  .btn-meet-launch {
    background: linear-gradient(135deg, rgba(0, 255, 102, 0.25), rgba(0, 180, 70, 0.4));
    border: 1px solid var(--matrix-green);
    color: #ffffff;
    padding: 9px 18px;
    border-radius: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: 0.2s;
    white-space: nowrap;
  }

  .btn-meet-launch:hover {
    background: var(--matrix-green);
    color: #000000;
    box-shadow: 0 0 24px rgba(0, 255, 102, 0.8);
    transform: translateY(-1px);
  }

  .meet-status-tag {
    display: none;
    font-size: 11px;
    color: var(--matrix-green);
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(0, 255, 102, 0.15);
    border: 1px solid var(--matrix-green);
  }

  /* ─── Responsive Adjustments ───────────────────────────────── */
  @media (max-width: 768px) {
    .hud-overlay { padding: 14px 16px; }
    .bottom-hud {
      gap: 8px;
      padding: 8px 10px;
    }
    .meet-cluster {
      width: 100%;
      min-width: 100%;
    }
    .brand-title { font-size: 11px; }
    .system-meta { display: none; }
    .subtitle-content { font-size: 13px; padding: 10px 14px; }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div class="hud-overlay">
  <!-- Top Status Bar -->
  <header class="top-hud">
    <div class="brand-badge interactive">
      <div class="pulse-dot"></div>
      <span class="brand-title">EVA MATRIX CORE // 3D SYNC</span>
    </div>
    <div class="system-meta interactive">
      <span>100.66.98.4 · 60 FPS · WEBRTC READY</span>
    </div>
  </header>

  <!-- Bottom Container: Subtitles + Minimalist Controls -->
  <div class="bottom-container">
    <!-- Floating Holographic Subtitles -->
    <div id="subtitle-box" class="subtitle-container">
      <div class="subtitle-content">
        <span class="subtitle-prompt">&gt; EVA:</span>
        <span id="subtitle-text">Инициализация матричного ядра...</span>
        <span class="cursor-blink">_</span>
      </div>
    </div>

    <!-- Bottom Minimalist Controls Bar -->
    <footer class="bottom-hud interactive">
      <!-- Mic Toggle Button -->
      <button id="btn-mic" class="btn-matrix" title="Голосовое управление">
        <span class="mic-icon">🎤</span>
        <span class="btn-label">Голос</span>
      </button>

      <!-- Ask Eva Button -->
      <button id="btn-speak" class="btn-matrix" title="Спросить Еву">
        <span>🔊</span>
        <span>Спросить</span>
      </button>

      <div class="hud-divider"></div>

      <!-- Google Meet Direct Connect -->
      <div class="meet-cluster">
        <input type="text" id="meet-input" class="meet-input" placeholder="meet.google.com/xxx-yyyy-zzz" autocomplete="off" spellcheck="false">
        <button id="btn-meet" class="btn-meet-launch" title="Подключиться к конференции Google Meet">
          <span>🚀</span>
          <span>В Google Meet</span>
        </button>
        <span id="meet-status" class="meet-status-tag">● В СЕССИИ</span>
      </div>
    </footer>
  </div>
</div>

<script src="dist/face.js?v=matrix3d_v2"></script>
</body>
</html>
