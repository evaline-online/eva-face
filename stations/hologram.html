<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eva Station 5 // Vector Hologram Eco 60 FPS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%2300ffcc'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/station.css">
<style>
  :root {
    --matrix-green: #00ffcc;
    --glass-border: rgba(0, 255, 204, 0.4);
  }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="hud-overlay">
  <header class="top-hud">
    <div class="brand-badge interactive">
      <div class="pulse-dot" style="background:#00ffcc; box-shadow:0 0 10px #00ffcc;"></div>
      <span class="brand-title" style="color:#00ffcc;">STATION 05 // VECTOR HOLOGRAM ECO</span>
    </div>
    <div class="station-nav interactive">
      <a href="index.html" class="btn-deck">🗂️ ВСЕ СТАНЦИИ</a>
      <a href="cyber.html" class="btn-step">СЛЕД: CYBER PBR →</a>
    </div>
    <div class="system-meta interactive">
      <span class="fps-badge"><span id="fps-val">60</span> FPS</span>
      <span class="meta-more">· STRICT 60 FPS ECO · ZERO LAG</span>
    </div>
  </header>

  <div class="bottom-container">
    <div id="subtitle-box" class="subtitle-container">
      <div class="subtitle-content" style="border-color: rgba(0, 255, 204, 0.55);">
        <span class="subtitle-prompt" style="color:#00ffcc;">&gt; HOLO:</span>
        <span id="subtitle-text">Станция 05 активна. Чистый векторный голографический градиент (гарантированные 60 FPS).</span>
        <span class="cursor-blink" style="color:#00ffcc;">_</span>
      </div>
    </div>

    <footer class="bottom-hud interactive">
      <button id="btn-mic" class="btn-matrix" title="Голос"><span class="mic-icon">🎤</span> Голос</button>
      <button id="btn-speak" class="btn-matrix" title="Спросить">🔊 Спросить</button>
      <div class="hud-divider"></div>
      <div class="meet-cluster">
        <input type="text" id="meet-input" class="meet-input" placeholder="meet.google.com/xxx-yyyy-zzz">
        <button id="btn-meet" class="btn-meet-launch">🚀 В Google Meet</button>
        <span id="meet-status" class="meet-status-tag">● В СЕССИИ</span>
      </div>
    </footer>
  </div>
</div>

<script src="../dist/face.js?v=station_hologram"></script>
<script>
  setTimeout(() => {
    const tierBtn = document.querySelector('.btn-tier[data-tier="eco"]');
    if (tierBtn) (tierBtn as any).click();
  }, 400);
</script>
</body>
</html>
