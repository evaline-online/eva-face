<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eva Station 6 // Cyberpunk PBR 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23ff007f'>🧬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/station.css">
<style>
  :root {
    --matrix-green: #00f0ff;
    --glass-border: rgba(0, 240, 255, 0.4);
  }
  .mode-switcher {
    display: flex;
    gap: 4px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 3px 6px;
    border-radius: 16px;
  }
  .btn-mode {
    background: transparent;
    border: 1px solid transparent;
    color: rgba(255, 255, 255, 0.65);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-mode.active {
    background: rgba(0, 240, 255, 0.25);
    border-color: #00f0ff;
    color: #00f0ff;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div class="hud-overlay">
  <header class="top-hud">
    <div class="brand-badge interactive">
      <div class="pulse-dot" style="background:#ff007f; box-shadow:0 0 10px #ff007f;"></div>
      <span class="brand-title" style="color:#00f0ff;">STATION 06 // CYBERPUNK PBR 3D</span>
    </div>

    <!-- Mode switch: hybrid / points / lines / polys -->
    <div class="mode-switcher interactive">
      <button class="btn-mode active" data-mode="hybrid">HYBRID</button>
      <button class="btn-mode" data-mode="points">POINTS</button>
      <button class="btn-mode" data-mode="lines">LINES</button>
      <button class="btn-mode" data-mode="polys">POLYS</button>
    </div>

    <div class="station-nav interactive">
      <a href="index.html" class="btn-deck">🗂️ ВСЕ СТАНЦИИ</a>
      <a href="solid.html" class="btn-step">СЛЕД: SOLID HD →</a>
    </div>

    <div class="system-meta interactive">
      <span class="fps-badge">60 FPS</span>
      <span class="meta-more">· PBR EYE-TRACKING · 3D</span>
    </div>
  </header>

  <div class="bottom-container">
    <div id="subtitle-box" class="subtitle-container">
      <div class="subtitle-content" style="border-color: rgba(0, 240, 255, 0.55);">
        <span class="subtitle-prompt" style="color:#00f0ff;">&gt; CYBER:</span>
        <span id="subtitle-text">Станция 06 активна. Физический PBR рендеринг с 3D-глазами и слежением зрачков.</span>
        <span class="cursor-blink" style="color:#00f0ff;">_</span>
      </div>
    </div>

    <footer class="bottom-hud interactive">
      <button id="btn-mic" class="btn-matrix" title="Голос"><span class="mic-icon">🎤</span> Голос</button>
      <button id="btn-speak" class="btn-matrix" title="Спросить">🔊 Спросить</button>
      <div class="hud-divider"></div>
      <div class="meet-cluster">
        <input type="text" id="meet-input" class="meet-input" placeholder="meet.google.com/xxx-yyyy-zzz">
        <button id="btn-meet" class="btn-meet-launch">🚀 В Google Meet</button>
        <span id="meet-status" class="meet-status-tag">● В СЕССИИ</span>
      </div>
    </footer>
  </div>
</div>

<script src="../dist/cyber.js?v=station_cyber"></script>
</body>
</html>
