<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ASCII 3D-голова — шейдинг (тени → объём)</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --ink:#c9d1d9; --dim:#8b949e; --acc:#ffcc66; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace; }
  body { padding:18px; }
  h1 { font-size:16px; letter-spacing:.5px; }
  h1 span { color:var(--acc); }
  .sub { color:var(--dim); font-size:12px; margin-bottom:14px; }
  .wrap { display:flex; gap:18px; flex-wrap:wrap; }
  .canvas {
    background:#0a0e14; border:1px solid #30363d; border-radius:10px;
    padding:14px; font-size:13px; line-height:1.15; white-space:pre;
    color:#e6edf3; box-shadow:inset 0 0 40px rgba(0,0,0,.6);
  }
  .panel { flex:1; min-width:280px; background:var(--panel); border:1px solid #30363d; border-radius:10px; padding:14px; }
  .panel h3 { margin:0 0 10px; font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .ctrl label { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12px; }
  .ctrl label span { width:130px; color:var(--dim); }
  .ctrl input[type=range] { flex:1; }
  .ctrl output { width:40px; text-align:right; }
  .btn { padding:6px 10px; margin:2px; border:1px solid #30363d; border-radius:6px; cursor:pointer; background:var(--bg); color:var(--ink); font-family:inherit; font-size:12px; }
  .btn:hover { border-color:var(--acc); }
  .btn.on { background:var(--acc); color:#000; border-color:var(--acc); }
  .switch { display:flex; align-items:center; gap:6px; margin:10px 0; font-size:12px; }
  .lane { display:flex; gap:4px; flex-wrap:wrap; }
  .stat { font-size:12px; color:var(--dim); margin-top:8px; }
  .hip { color:#3fb950; }
</style>
</head>
<body>
  <h1>3D-<span>Голова</span></h1>
  <div class="sub">шейдинг → объём: направленный свет, тени под носом/губами/челюстью, вращение. Тот же движок <span class="hip">head.js</span>, что и в терминале (<span class="hip">node head3d.node.js</span>).</div>
  <div class="wrap">
    <div class="canvas" id="face"></div>
    <div class="panel">
      <div class="switch">
        <input type="checkbox" id="anim" checked> <label for="anim">Авто-анимация: речь · наклон · взгляд · моргание</label>
      </div>
      <h3>Пресеты</h3>
      <div class="lane" id="presets"></div>
      <h3>Параметры</h3>
      <div class="ctrl">
        <label><span>Рот (речь)</span> <input type="range" id="pMouth" min="0" max="1" step="0.01" value="0.3"> <output id="oMouth">0.30</output></label>
        <label><span>Улыбка</span> <input type="range" id="pSmile" min="-1" max="1" step="0.01" value="0.3"> <output id="oSmile">0.30</output></label>
        <label><span>Наклон (roll)</span> <input type="range" id="pRoll" min="-30" max="30" step="1" value="0"> <output id="oRoll">0°</output></label>
        <label><span>Кивок (pitch)</span> <input type="range" id="pPitch" min="-30" max="30" step="1" value="0"> <output id="oPitch">0°</output></label>
        <label><span>Взгляд X</span> <input type="range" id="pLookX" min="-1" max="1" step="0.05" value="0"> <output id="oLookX">0.00</output></label>
        <label><span>Взгляд Y</span> <input type="range" id="pLookY" min="-1" max="1" step="0.05" value="0"> <output id="oLookY">0.00</output></label>
        <label><span>Моргание</span> <input type="range" id="pBlink" min="0" max="1" step="1" value="0"> <output id="oBlink">откр</output></label>
        <label><span>Высота</span> <input type="range" id="pHeight" min="18" max="40" step="1" value="26"> <output id="oHeight">26</output></label>
        <label><span>Ширина</span> <input type="range" id="pWidth" min="36" max="80" step="1" value="52"> <output id="oWidth">52</output></label>
        <label><span>Размер шрифта</span> <input type="range" id="pFont" min="8" max="18" step="1" value="13"> <output id="oFont">13</output></label>
      </div>
      <div class="switch"><input type="checkbox" id="pGlasses"> <label for="pGlasses">Очки</label></div>
      <div class="switch"><input type="checkbox" id="pBlocks"> <label for="pBlocks">Тени-блоки ░▒▓█</label></div>
      <div class="stat" id="hud"></div>
    </div>
  </div>
<script>
/*__HEADS__*/
(function () {
  var q = {};
  location.search.slice(1).split('&').filter(Boolean).forEach(function (kv) {
    var sp = kv.indexOf('='), k = kv.slice(0, sp < 0 ? kv.length : sp), v = kv.slice(sp < 0 ? kv.length : sp + 1);
    q[k] = decodeURIComponent(v);
  });
  var faceEl = document.getElementById('face');
  var hudEl = document.getElementById('hud');
  var animBox = document.getElementById('anim');
  var fixedT = q.t != null ? parseFloat(q.t) : null;
  if (fixedT != null) animBox.checked = false;
  var p = { mouthOpen:0.3, smile:0.3, roll:0, pitch:0, lookX:0, lookY:0, blink:0, glasses:0, expression:'neutral', width:52, height:26 };

  var BLOCK_MAP = { '@':'█','#':'▓','%':'▓','*':'▒','+':'░','-':'░','=':'░',':':' ','.':' ',' ':' ' };
  function blocks(row){ return row.split('').map(c=>(BLOCK_MAP[c]!==undefined?BLOCK_MAP[c]:c)).join(''); }

  function draw(){
    var rows = AsciiLab.renderHead(p);
    if (document.getElementById('pBlocks').checked) rows = rows.map(blocks);
    faceEl.textContent = rows.join('\n');
    hudEl.textContent = 'roll ' + Math.round(p.roll) + '° · pitch ' + Math.round(p.pitch) + '° · mouth ' + (+p.mouthOpen).toFixed(2) + ' · smile ' + (+p.smile).toFixed(2) +
      ' · blink ' + (p.blink?'ня':'откр') + ' · размер ' + p.width + '×' + p.height + ' — движок head.js (там же, что у терминала)';
  }
  function sync(){
    document.getElementById('pMouth').value=p.mouthOpen; document.getElementById('oMouth').textContent=(+p.mouthOpen).toFixed(2);
    document.getElementById('pSmile').value=p.smile; document.getElementById('oSmile').textContent=(+p.smile).toFixed(2);
    document.getElementById('pRoll').value=p.roll; document.getElementById('oRoll').textContent=p.roll+'°';
    document.getElementById('pPitch').value=p.pitch; document.getElementById('oPitch').textContent=p.pitch+'°';
    document.getElementById('pLookX').value=p.lookX; document.getElementById('oLookX').textContent=(+p.lookX).toFixed(2);
    document.getElementById('pLookY').value=p.lookY; document.getElementById('oLookY').textContent=(+p.lookY).toFixed(2);
    document.getElementById('pBlink').value=p.blink; document.getElementById('oBlink').textContent=p.blink?'закрыто':'откр';
    document.getElementById('pHeight').value=p.height; document.getElementById('oHeight').textContent=p.height;
    document.getElementById('pWidth').value=p.width; document.getElementById('oWidth').textContent=p.width;
    document.getElementById('pGlasses').checked=!!p.glasses;
  }

  function bind(id,out,fmt,key){ document.getElementById(id).addEventListener('input',function(){ p[key]=parseFloat(this.value); document.getElementById(out).textContent=fmt(this.value); }); }
  bind('pMouth','oMouth',v=>(+v).toFixed(2),'mouthOpen');
  bind('pSmile','oSmile',v=>(+v).toFixed(2),'smile');
  bind('pRoll','oRoll',v=>v+'°','roll');
  bind('pPitch','oPitch',v=>v+'°','pitch');
  bind('pLookX','oLookX',v=>(+v).toFixed(2),'lookX');
  bind('pLookY','oLookY',v=>(+v).toFixed(2),'lookY');
  bind('pBlink','oBlink',v=>v?'закрыто':'откр','blink');
  bind('pHeight','oHeight',v=>String(v),'height');
  bind('pWidth','oWidth',v=>String(v),'width');
  document.getElementById('pFont').addEventListener('input',function(){ faceEl.style.fontSize=this.value+'px'; document.getElementById('oFont').textContent=this.value; });
  document.getElementById('pGlasses').onchange=function(){ p.glasses=this.checked?1:0; draw(); };
  document.getElementById('pBlocks').onchange=draw;

  var pb=document.getElementById('presets');
  AsciiLab.presets().forEach(pr=>{
    var b=document.createElement('button');
    b.className='btn'; b.textContent=pr.name;
    b.onclick=function(){ Object.keys(pr).forEach(k=>{ if(k!=='name') p[k]=pr[k]; }); animBox.checked=false; sync(); draw(); };
    pb.appendChild(b);
  });

  var t0=null;
  if (fixedT != null) {
    var ap = AsciiLab.animateParams(fixedT);
    Object.keys(ap).forEach(function(k){ p[k]=ap[k]; });
    p.width && ap.width;
    draw();
  }
  function loop(ts){
    if(!t0) t0=ts;
    if(animBox.checked){
      var t=(ts-t0)/1000;
      var ap=AsciiLab.animateParams(t);
      Object.keys(ap).forEach(k=>{ if(k!=='width'&&k!=='height') p[k]=ap[k]; });
      draw();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  draw();
})();
</script>
</body>
</html>
